# Fabrikkens egen konfiguration. M5a tilføjer API-porten.

# GitHub Project-boardet, fabrikken henter arbejde fra. Rækkefølgen i "ready" er prioriteten.
board:
  owner: nikolajjepsen
  number: 1
  # Navnene på Status-kolonnerne på boardet.
  status:
    ready: Ready
    in_progress: In progress
    review: In review
    done: Done

# Kun kommentarer fra denne GitHub-bruger udføres som /factory-kommandoer.
owner_login: nikolajjepsen

# Repoet med det fastgjorte "Factory Status"-issue.
status_repo: nikolajjepsen/factory

# Runneren, workflows bruger, når en stage ikke vælger en anden.
default_runner: codex

limits:
  # Hvor længe CI-gaten venter på, at tjek bliver færdige.
  ci_timeout_minutes: 30

# Kvotepolitikken. Daemonen læser Codex-kvoten før hvert trin og hvert 5. minut, mens den venter.
quota:
  # Hold pause, når der er under denne andel tilbage af 5-timersvinduet.
  pause_below_5h: 15%
  # Den del af ugekvoten, fabrikken aldrig rører, så du selv kan bruge Codex.
  reserve_for_me: 0%
  # even: fordel ugekvoten jævnt over dagene til nulstilling. none: brug den, så længe den rækker.
  pacing: even
